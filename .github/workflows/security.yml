name: Security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 22 * * 0"

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@<SHA> # v5
      - uses: github/codeql-action/init@<SHA> # v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@<SHA> # v3

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<SHA> # v5
      - uses: actions/dependency-review-action@<SHA> # v4
        with:
          fail-on-severity: high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<SHA> # v5
        with:
          fetch-depth: 0
      # Repositori organisasi butuh lisensi gitleaks-action; alternatif: secret scanning GitHub.
      - uses: gitleaks/gitleaks-action@<SHA> # v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@<SHA> # v5
      - uses: pnpm/action-setup@<SHA> # v4
      - uses: actions/setup-node@<SHA> # v5
        with:
          node-version-file: .nvmrc
      - run: pnpm audit --audit-level=high
