# Ganti setiap <SHA> dengan full commit SHA rilis action (SH-SUPPLY-03). Dependabot memperbaruinya.
name: CI
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *" # E2E penuh malam hari (01.00 WIB)
  workflow_dispatch:
    inputs:
      e2e_full:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@<SHA> # v5
      - uses: pnpm/action-setup@<SHA> # v4
      - uses: actions/setup-node@<SHA> # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit --coverage
      - run: pnpm check:duplication

  integration:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@<SHA> # v5
      - uses: pnpm/action-setup@<SHA> # v4
      - uses: actions/setup-node@<SHA> # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@<SHA> # v1
        with:
          version: 2.121.0 # sama dengan devDependency `supabase`
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x studio,imgproxy,edge-runtime
      - run: supabase db reset
      - run: supabase test db
      - run: pnpm db:env
      - run: pnpm test:integration

  build:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@<SHA> # v5
      - uses: pnpm/action-setup@<SHA> # v4
      - uses: actions/setup-node@<SHA> # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  e2e:
    needs: [integration, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@<SHA> # v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@<SHA> # v4
      - uses: actions/setup-node@<SHA> # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          FULL: ${{ github.event_name == 'schedule' || inputs.e2e_full || contains(github.event.pull_request.labels.*.name, 'e2e:full') }}
        run: node scripts/affected-e2e.mjs >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.grep != ''
        uses: supabase/setup-cli@<SHA> # v1
        with:
          version: 2.121.0 # sama dengan devDependency `supabase`
      - if: steps.scope.outputs.grep != ''
        run: |
          supabase start -x studio,imgproxy,edge-runtime
          supabase db reset
          pnpm db:env
          pnpm exec playwright install --with-deps chromium
      - if: steps.scope.outputs.grep != ''
        env:
          GREP: ${{ steps.scope.outputs.grep }}
        run: pnpm test:e2e --grep "$GREP"
      - if: failure()
        uses: actions/upload-artifact@<SHA> # v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
