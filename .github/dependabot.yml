version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    # Naik versi mayor dikerjakan sebagai tugas tersendiri dan diuji lengkap. `@types/node` harus
    # sama dengan versi mayor Node di `.nvmrc`. Alert keamanan tetap muncul di tab Security.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    cooldown: { default-days: 14 }
    groups:
      actions:
        patterns: ["*"]
