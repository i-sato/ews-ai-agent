<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Pelatihan (mobile) — EWS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; position: relative; background: #F5F6F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B2430">
  <header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: #0F1B33; color: #FFFFFF">
    <h1 style="margin: 0; font-size: 18px; flex: 1">Pelatihan</h1>
    <a href="M-Impor.dc.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border-radius: 8px; background: #1F4FD1; color: #FFFFFF; text-decoration: none; font-size: 13px; font-weight: 600">Impor data</a>
  </header>

  <div style="display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: #FFFFFF; border-bottom: 1px solid #E2E5EA">
    <sc-for list="{{filters}}" as="f" hint-placeholder-count="4">
      <button type="button" aria-pressed="{{f.sel}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
    </sc-for>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 12px 16px 90px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{list}}" as="t" hint-placeholder-count="4">
      <a href="M-PelatihanDetail.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 12px; text-decoration: none; color: #1B2430">
        <div style="display: flex; justify-content: space-between; gap: 8px; align-items: center">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #5B6573">{{t.code}} · {{t.status}}</span>
          <span style="{{t.pill.style}}">{{t.pill.label}}</span>
        </div>
        <div style="font-weight: 700; font-size: 15px">{{t.name}}</div>
        <div style="font-size: 12px; color: #5B6573">{{t.period}} · {{t.count}} peserta</div>
        <sc-if value="{{t.hasCats}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 6px">
            <div style="display: flex; gap: 2px; height: 8px; border-radius: 4px; overflow: hidden">
              <div style="{{t.segA}}"></div><div style="{{t.segB}}"></div><div style="{{t.segC}}"></div><div style="{{t.segD}}"></div>
            </div>
            <div style="font-size: 12px; color: #3A4452">{{t.catText}}</div>
          </div>
        </sc-if>
        <div style="font-size: 12px; color: #3A4452; border-top: 1px solid #EEF0F3; padding-top: 8px">{{t.foot}}</div>
      </a>
    </sc-for>
  </div>

  <nav aria-label="Menu utama" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E5EA">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="{{t.style}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { status: 'all' }; }
  renderVals() {
    const ACTIVE = 'Pelatihan';
    const TABS = [
      ['Dashboard', 'M-Dashboard.dc.html', 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z'],
      ['Pelatihan', 'M-Pelatihan.dc.html', 'M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5v14zM4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5'],
      ['Risiko', 'M-Risiko.dc.html', 'M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01'],
      ['Laporan', 'M-Laporan.dc.html', 'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6M8 13h8M8 17h8'],
      ['Lainnya', 'M-Lainnya.dc.html', 'M3 6h18M3 12h18M3 18h18']
    ];
    const tabs = TABS.map(([label, href, d]) => ({ label, href, d, style: { display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: '2px', textDecoration: 'none', fontSize: '11px', fontWeight: 600, color: label === ACTIVE ? '#1F4FD1' : '#5B6573' } }));
    const ST = { kritis: ['Kritis', '#FEE4E2', '#B42318'], waspada: ['Waspada', '#FEF0C7', '#93370D'], normal: ['Normal', '#DCFAE6', '#085D3A'], stale: ['Data kurang', '#EAECF0', '#344054'], none: ['Belum dinilai', '#F2F4F7', '#475467'] };
    const pill = (k) => ({ label: ST[k][0], style: { display: 'inline-block', padding: '2px 8px', borderRadius: '999px', fontSize: '11px', fontWeight: 600, background: ST[k][1], color: ST[k][2], whiteSpace: 'nowrap' } });
    const COL = ['#D0D5DD', '#9DB4F5', '#1F4FD1', '#F79009'];
    const seg = (c, i) => ({ flex: c[i] + ' 1 0px', minWidth: c[i] ? '3px' : '0px', background: COL[i] });
    const D = [
      ['TRN-001', 'Pemrograman Web (IAWD)', '21–31 Okt 2026', 'Berlangsung', '41', [5, 23, 12, 1], 'Rata-rata LMS 55% · terbanyak berhenti di M15 KUIS 1', 'kritis'],
      ['TRN-002', 'Instalasi Kabel Fiber Optik (OIAT)', '13 Okt – 3 Nov 2026', 'Berlangsung', '50', [4, 30, 16, 0], 'Rata-rata LMS 61% · terbanyak berhenti di M16', 'waspada'],
      ['TRN-003', 'Pelatihan Keamanan Informasi', '14 Okt – 7 Nov 2026', 'Berlangsung', '30', null, 'Data terakhir 19 Okt 2026 · melewati batas kesegaran', 'stale'],
      ['TRN-004', 'Pelatihan Literasi Digital', '14–18 Sep 2026', 'Selesai', '45', [0, 3, 42, 0], 'Rata-rata LMS 96%', 'normal'],
      ['TRN-006', 'Pelatihan Tata Kelola Data', '9–13 Nov 2026', 'Direncanakan', '—', null, 'Belum ada impor', 'none']
    ];
    const st = this.state.status;
    const chip = (on) => ({ flex: '0 0 auto', minHeight: '36px', padding: '0 12px', borderRadius: '999px', border: on ? '0' : '1px solid #CBD2DC', background: on ? '#1B2430' : '#FFFFFF', color: on ? '#FFFFFF' : '#1B2430', font: 'inherit', fontSize: '13px', fontWeight: 600, cursor: 'pointer' });
    const F = [['all', 'Semua'], ['Berlangsung', 'Berlangsung'], ['Selesai', 'Selesai'], ['Direncanakan', 'Direncanakan']];
    return {
      tabs,
      filters: F.map(([id, label]) => ({ label, sel: st === id ? 'true' : 'false', pick: () => this.setState({ status: id }), style: chip(st === id) })),
      list: D.filter((d) => st === 'all' || d[3] === st).map((d) => {
        const c = d[5];
        return {
          code: d[0], name: d[1], period: d[2], status: d[3], count: d[4], foot: d[6], pill: pill(d[7]),
          hasCats: !!c,
          segA: c ? seg(c, 0) : {}, segB: c ? seg(c, 1) : {}, segC: c ? seg(c, 2) : {}, segD: c ? seg(c, 3) : {},
          catText: c ? c[0] + ' belum mulai · ' + c[1] + ' sebagian · ' + c[2] + ' tuntas' + (c[3] ? ' · ' + c[3] + ' perlu dicek' : '') : ''
        };
      })
    };
  }
}
</script>
</body>
</html>
