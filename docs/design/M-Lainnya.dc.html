<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Menu Lainnya (mobile) — EWS</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4FD1}a:hover{color:#163A9C}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; position: relative; background: #F5F6F8; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #1B2430">
  <header style="padding: 14px 16px; background: #0F1B33; color: #FFFFFF">
    <h1 style="margin: 0; font-size: 18px">Lainnya</h1>
  </header>

  <div style="flex: 1; overflow-y: auto; padding: 16px 16px 90px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 12px; padding: 14px; background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 12px">
      <div style="width: 44px; height: 44px; border-radius: 50%; background: #EEF2FF; color: #2A3FA0; display: flex; align-items: center; justify-content: center; font-weight: 700">NP</div>
      <div><div style="font-weight: 700">[Nama Pengguna]</div><div style="font-size: 13px; color: #5B6573">Role: Pengelola Pelatihan · [Unit]</div></div>
    </div>

    <nav aria-label="Menu lainnya" style="background: #FFFFFF; border: 1px solid #E2E5EA; border-radius: 12px; overflow: hidden">
      <sc-for list="{{items}}" as="m" hint-placeholder-count="3">
        <a href="{{m.href}}" style="{{m.style}}">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: #3A4452; flex: 0 0 22px"><path d="{{m.d}}"></path></svg>
          <span style="flex: 1"><span style="display: block; font-weight: 600; font-size: 15px; color: #1B2430">{{m.label}}</span><span style="display: block; font-size: 12px; color: #5B6573">{{m.desc}}</span></span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#98A2B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg>
        </a>
      </sc-for>
    </nav>

    <div style="font-size: 12px; color: #5B6573; line-height: 1.5; padding: 0 4px">Menu yang tampil mengikuti role yang diverifikasi di server. Pengaturan hanya tersedia untuk Admin.</div>

    <a href="M-Login.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 10px; border: 1px solid #CBD2DC; background: #FFFFFF; text-decoration: none; color: #B42318; font-weight: 600; font-size: 15px">Keluar</a>
  </div>

  <nav aria-label="Menu utama" style="position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: #FFFFFF; border-top: 1px solid #E2E5EA">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="5">
      <a href="{{t.href}}" style="{{t.style}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.d}}"></path></svg>
        <span>{{t.label}}</span>
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>

</body>
</html>
