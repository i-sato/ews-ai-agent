title = "EWS AI Agent"

[extend]
useDefault = true

# Nomor registrasi peserta (12 digit, tanda hubung, 1–2 digit). Data riil tidak boleh di-commit (SH-PDP-05).
[[rules]]
id = "participant-registration-number"
description = "Pola NO REGISTRASI peserta"
regex = '''\b\d{12}-\d{1,2}\b'''
tags = ["pii"]

[[rules.allowlists]]
paths = ['''^tests/fixtures/''']

# Placeholder bernilai nol pada contoh kontrak data spesifikasi §3.3; bukan nomor peserta.
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''^000000000001-01$''']

# Nilai sintetis pada tes unit verifikasi CRON_SECRET (F2-08); bukan secret sungguhan.
[[allowlists]]
regexes = ['''^rahasia-cron-uji-0123456789$''']
